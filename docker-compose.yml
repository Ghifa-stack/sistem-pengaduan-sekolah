version: '3.9'

services:
  postgres:
    image: postgres:16-alpine
    container_name: pengaduan_db
    restart: unless-stopped
    environment:
      POSTGRES_USER: pengaduan_user
      POSTGRES_PASSWORD: pengaduan_pass
      POSTGRES_DB: pengaduan_sekolah
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U pengaduan_user -d pengaduan_sekolah"]
      interval: 10s
      timeout: 5s
      retries: 5

  app:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: pengaduan_app
    restart: unless-stopped
    ports:
      - "3000:3000"
    environment:
      DATABASE_URL: "postgresql://pengaduan_user:pengaduan_pass@postgres:5432/pengaduan_sekolah?schema=public"
      NEXTAUTH_URL: "http://localhost:3000"
      NEXTAUTH_SECRET: "super-secret-key-ganti-di-production-32chars"
      NODE_ENV: development
    depends_on:
      postgres:
        condition: service_healthy
    volumes:
      - .:/app
      - /app/node_modules
      - /app/.next

volumes:
  postgres_data:
